name: Frontend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FolvestApp

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FolvestApp/package-lock.json

      - name: Installera dependencies
        run: npm ci

      - name: Bygg React-appen
        run: npm run build